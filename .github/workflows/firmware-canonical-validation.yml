name: Firmware canonical identity validation

on:
  push:
    branches: [verify/firmware-canonical-20261025]

permissions:
  contents: read

concurrency:
  group: firmware-canonical-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    name: Original firmware boundaries and static checks
    if: github.repository == 'sunxiuguo/rea' && github.ref == 'refs/heads/verify/firmware-canonical-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: "0"
      TURBO_TOKEN: ""
      TURBO_TEAM: ""
      TURBO_CACHE: "local:rw"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Supply the exact declared npm without a global installation
        run: |
          test "$(cat .nvmrc)" = "24.18.0"
          test "$(node --version)" = "v24.18.0"
          test "$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).packageManager')" = "npm@11.16.0"
          npm install --prefix "$RUNNER_TEMP/rea-pinned-npm" --ignore-scripts --no-audit --no-fund npm@11.16.0
          echo "$RUNNER_TEMP/rea-pinned-npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Record immutable source and toolchain
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(npm --version)" = "11.16.0"
          {
            git rev-parse HEAD
            node --version
            npm --version
            sha256sum package.json package-lock.json tests/fixtures/firmware/provider.ts tests/boundary/firmware/firmwareFixtureIdentity.test.ts
          }
      - name: Install locked packages without uncontrolled optional native builds
        id: dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          # These two exact locked installers select/verify packaged esbuild binaries.
          # Do not run Frida's fallback to make or recursive submodule acquisition.
          unset ESBUILD_BINARY_PATH
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createRequire } from "node:module";
          import { resolve } from "node:path";
          assert.equal(process.platform, "linux");
          assert.equal(process.arch, "x64");
          for (const root of ["node_modules/esbuild", "node_modules/vitepress/node_modules/esbuild"]) {
            const require = createRequire(resolve(root, "package.json"));
            const packageVersion = require("./package.json").version;
            assert.equal(require("@esbuild/linux-x64/package.json").version, packageVersion);
            require.resolve("@esbuild/linux-x64/bin/esbuild");
          }
          NODE
          node node_modules/esbuild/install.js
          node node_modules/vitepress/node_modules/esbuild/install.js
          node scripts/check-dependency-install.mjs
          printf '%s\n' 'Frida lifecycle was not executed; this is not real-provider or full qualification.'
      - name: Verify unchanged test discovery policy
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run verify:test-discovery
      - name: Run original affected firmware suites and identity regression
        run: |
          set -o pipefail
          npm run test:focused -- \
            tests/boundary/firmware/firmwareFixtureIdentity.test.ts \
            tests/boundary/firmware/firmwareIntegration.test.ts \
            tests/boundary/firmware/firmwareWorkspaceRecovery.test.ts \
            tests/boundary/mcp/firmwareMcp.test.ts \
            tests/process-global/firmwarePublicationDeadline.test.ts
      - name: Run unchanged fast native static gate
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run check:fast
